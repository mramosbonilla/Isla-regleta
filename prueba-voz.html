<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prueba de voz Nicolás</title><style>body{font:17px system-ui;background:#f4f2ff;color:#24204b;padding:24px;max-width:600px;margin:auto}textarea,button{font:inherit;padding:12px;border-radius:10px}textarea{box-sizing:border-box;width:100%}button{background:#29245b;color:white;border:0;margin:8px 0}pre{white-space:pre-wrap}</style><h1>Laboratorio de voz</h1><p>Nicolás · Piper · español de México. Prueba experimental independiente del juego. Usa Wi-Fi: descarga un modelo de voz y bibliotecas.</p><textarea id="msg" rows="4">¡Hola, Sebastián! Mi nombre es Nicolás y soy tu profesor de matemáticas. Diez más cuatro, menos siete, es igual a siete.</textarea><button id="generate">1. Preparar voz</button> <button id="play" disabled>2. Escuchar</button><p id="status" role="status">Listo para iniciar.</p><audio id="audio" controls></audio><script type="module">const $=id=>document.getElementById(id);let url; $("generate").onclick=async()=>{ $("generate").disabled=true;$("play").disabled=true;try{$("status").textContent="Cargando motor…";const tts=await import("https://esm.sh/@mintplex-labs/piper-tts-web?bundle");$("status").textContent="Descargando modelo y preparando audio…";const wav=await tts.predict({text:$("msg").value,voiceId:"es_MX-ald-medium"},p=>{$("status").textContent=p.total?"Descarga: "+Math.round(100*p.loaded/p.total)+"%":"Preparando voz…"});if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(wav);$("audio").src=url;$("play").disabled=false;$("status").textContent="Audio preparado. Pulsa Escuchar.";}catch(e){$("status").textContent="Error: "+(e.message||e);}finally{$("generate").disabled=false;}};$("play").onclick=()=>{$("audio").play().catch(e=>$("status").textContent="Error de reproducción: "+e.message);};</script></html>
