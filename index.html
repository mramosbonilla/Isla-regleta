<style>

.map{display:grid;min-height:0;align-self:stretch}

@media(max-width:600px){.map img{height:auto}}
/* The work area has one numeric grid. Prose and controls use the full sheet. */

  width:min(100%,calc(var(--cols)*(var(--digit) + var(--gap)) + 8px));gap:.38rem}

<body>
<header><button class="brand" data-go="home"><span aria-hidden="true">▰</span>Operaciones básicas con Vale</button><button data-go="family">Para familia</button></header>
<main id="app"></main>
<noscript>Activa JavaScript para jugar a Operaciones básicas con Vale.</noscript>
<script>
"use strict";
const app = document.querySelector("#app");
const key = "isla-regleta-v1";
const defaults = {mode:"custom",op:"mul",da:2,db:2,size:3,add:"any",sub:"any",div:"exact"};
const ops = {
  add:{name:"Suma",symbol:"+"}, sub:{name:"Resta",symbol:"−"},
  mul:{name:"Multiplicación",symbol:"×"}, div:{name:"División",symbol:"÷"}
};
const missionNames = {detect:"Detective de historias",bridge:"Taller de puentes",garden:"Huerto en filas",dock:"Muelle de reparto"};
const rodColors = ["#fff","#dc3949","#9bd751","#cc73af","#ffd448","#267e51","#262829","#9b5a35","#3477d5","#f68c35"];
const lightInk = new Set([2,6,7,8,9]);
let saved = {};
try { saved = JSON.parse(localStorage.getItem(key) || "{}") || {}; } catch {}
const data = {config:{...defaults,...saved.config},round:saved.round || null,
  history:saved.history || [],board:saved.board || [[],[],[]],labels:saved.labels ?? true};
let storageAvailable = true;
let page = "home";
let selectedRod = 1;
const boardUndo = [];
let speaking = null;
let voices = [];
const synth = window.speechSynthesis;
function updateVoices() {
  voices = (synth?.getVoices() || []).filter(voice => /^es\b/i.test(voice.lang) && voice.localService);
  const button = document.querySelector("#listen");
  if (button) button.hidden = !voices.length;
}
synth?.addEventListener("voiceschanged", updateVoices);
updateVoices();

function save() {
  try { localStorage.setItem(key,JSON.stringify(data)); }
  catch { storageAvailable = false; }
}
save();

const random = (min,max) => min + Math.floor(Math.random() * (max-min+1));
const range = digits => [10 ** (digits-1),10 ** digits-1];
const fmt = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g,"\u202f");
function shuffled(values) {
  const copy = [...values];
  for (let i=copy.length-1;i>0;i--) {
    const j = random(0,i);
    [copy[i],copy[j]] = [copy[j],copy[i]];
  }
  return copy;
}
function hasRegroup(a,b,type) {
  while (a || b) {
    const x = a%10, y = b%10;
    if (type==="add" ? x+y>=10 : x<y) return true;
    a = Math.floor(a/10);
    b = Math.floor(b/10);
  }
  return false;
}
function makePair(op,c) {
  const [loA,hiA] = range(c.da);
  const [loB,hiB] = range(c.db);
  if (op==="sub" && (loB>hiA || (c.da===1 && c.sub==="yes"))) return null;
  if (op==="div") {
    if (c.div==="exact" && loB>hiA) return null;
    if (c.div==="remainder" && loB>hiA) return [random(loA,hiA),random(loB,hiB)];
    for (const b of shuffled(Array.from({length:hiB-loB+1},(_,i)=>loB+i))) {
      if (c.div==="exact") {
        const min = Math.ceil(loA/b), max = Math.floor(hiA/b);
        if (min<=max) return [b*random(min,max),b];
      } else if (b>1) {
        const a = random(loA,hiA);
        if (a%b) return [a,b];
        if (a<hiA) return [a+1,b];
      }
    }
    return null;
  }
  for (let i=0;i<500;i++) {
    const a=random(loA,hiA), b=random(loB,hiB);
    if (op==="sub" && a<b) continue;
    if (op==="add" || op==="sub") {
      const rule=c[op];
      if (rule!=="any" && hasRegroup(a,b,op)!==(rule==="yes")) continue;
    }
    return [a,b];
  }
  if (op==="add" && c.add==="yes") return [hiA,hiB];
  if (op==="sub" && c.sub==="yes") {
    return c.da===c.db ? [loA+10,loB+1] : [loA+1,loB+2];
  }
  return [op==="sub"?hiA:loA,loB];
}

const themes = [
  {plural:"pegatinas",place:"el club",groups:"sobres"},
  {plural:"semillas",place:"el huerto",groups:"bolsitas"},
  {plural:"fichas",place:"el taller",groups:"cajas"},
  {plural:"conchas",place:"la playa",groups:"bandejas"},
  {plural:"tarjetas",place:"la biblioteca",groups:"paquetes"}
];
function problem(op,a,b,{variant=random(0,3),theme=random(0,4),mission=""}={}) {
  const x=fmt(a), y=fmt(b);
  const {plural,place,groups}=themes[theme];
  const q=Math.floor(a/b), r=op==="div"?a%b:0;
  let answer, story, goal, wrong, clue, interpretation="", kind="";
  if (op==="add") {
    answer=a+b;
    goal="La cantidad total";
    wrong=["La diferencia entre las dos cantidades","La cantidad de un solo grupo"];
    if (variant%2) {
      kind="start";
      story=`En ${place} había algunas ${plural}. Se entregaron ${y} y quedaron ${x}. ¿Cuántas había al comienzo?`;
      goal="La cantidad que había al comienzo";
      clue="¿Las piezas que se entregaron también estaban al comienzo?";
    } else {
      story=`En ${place} reunieron ${x} ${plural} por la mañana y ${y} por la tarde. ¿Cuántas reunieron en total?`;
      clue="¿Hay que contar lo reunido en ambos momentos?";
    }
  } else if (op==="sub") {
    answer=a-b;
    goal="Lo que falta para completar";
    wrong=["El total original","Cuántos grupos iguales se pueden formar"];
    if (mission==="bridge") {
      story=`El puente debe medir ${x} unidades. Ya hay un tramo de ${y}. ¿Cuántas unidades faltan?`;
      clue="¿El tramo que falta se une al construido para alcanzar la longitud total?";
    } else if (variant===0) {
      story=`En ${place} hay ${x} ${plural}. Se usan ${y}. ¿Cuántas quedan?`;
      goal="La cantidad que queda";
      clue="¿Las piezas usadas siguen disponibles?";
    } else if (variant===1) {
      story=`Un equipo reunió ${x} ${plural} y otro reunió ${y}. ¿Cuántas más reunió el primero?`;
      goal="La diferencia entre los dos equipos";
      clue="Si emparejas las piezas de los dos equipos, ¿qué cantidad queda sin pareja?";
    } else {
      story=`En ${place} quieren reunir ${x} ${plural}. Ya tienen ${y}. ¿Cuántas les faltan?`;
      clue="¿Qué cantidad falta para pasar de lo que ya tienen a la meta?";
    }
  } else if (op==="mul") {
    answer=a*b;
    goal="El total de todos los grupos";
    wrong=["Cuántas hay en un solo grupo","Cuántos grupos hay"];
    story=mission==="garden"
      ? `En el huerto hay ${x} filas con ${y} plantas en cada fila. ¿Cuántas plantas hay?`
      : `Preparan ${x} ${groups} con ${y} ${plural} en cada uno. ¿Cuántas ${plural} usan?`;
    clue=`¿${y} es el total o lo que se repite en cada grupo?`;
  } else {
    answer=q;
    wrong=["El total de partida","Lo que falta para llegar al total"];
    if (r && variant%2) {
      kind="vehicles";
      goal="La cantidad de vehículos para que todos viajen";
      story=`Viajan ${x} personas. Cada vehículo tiene ${y} plazas. ¿Cuántos vehículos necesitan para que viajen todas?`;
      interpretation="Vehículos necesarios";
      clue="Si después de llenar vehículos quedan personas, ¿cómo viajarán?";
    } else if (variant===2) {
      kind="share";
      goal="Cuántas recibe cada grupo";
      story=`Reparten ${x} ${plural} por igual entre ${y} equipos. ¿Cuántas recibe cada equipo${r?" y cuántas quedan sin repartir":""}?`;
      clue=`¿${y} indica cuántos equipos hay o cuántas piezas recibe cada uno?`;
    } else {
      goal="Cuántos grupos completos se pueden formar";
      story=`Hay ${x} ${plural}. En cada paquete caben ${y}. ¿Cuántos paquetes completos se pueden formar${r?" y cuántas quedan sueltas":""}?`;
      clue=`¿${y} indica cuántos paquetes hay o cuántas piezas caben en cada uno?`;
    }
  }
  return {op,a,b,variant,theme,mission,answer,r,story,goal,clue,kind,interpretation,
    choices:shuffled([goal,...wrong]),operations:shuffled(Object.keys(ops))};
}

function detectivePair(a,b) {
  const division=problem("div",a,b);
  Object.assign(division,{story:`Van ${a} personas de excursión. Cada vehículo tiene ${b} plazas. ¿Cuántos vehículos necesitan?`,
    goal:"Cuántos vehículos necesitan",clue:`¿El ${b} indica las plazas de cada vehículo o personas que ya se sentaron?`,kind:"groups"});
  division.choices=shuffled([division.goal,"Personas que faltan por sentarse","Plazas de un solo vehículo"]);
  const subtraction=problem("sub",a,b);
  Object.assign(subtraction,{story:`Van ${a} personas de excursión. Ya se sentaron ${b}. ¿Cuántas faltan por sentarse?`,

function lessonQueue(mission,c) {
  if (mission==="detect") {
    const [a,b]=[random(3,8),random(3,8)];
    const pair=detectivePair(a*b,b);
    pair.forEach(p=>{p.da=String(p.a).length;p.db=1;});
    return [...pair,...[24,35,48].slice(0,c.size-2).map((n,i)=>
      problem(["mul","add","sub"][i],n,[6,8,9][i],{theme:i,variant:i}))];
  }

    if (i===0) return problem("sub",13,5,{mission});

    const gap=random(2,9);
    if (i%2===0) return problem("sub",b+gap,b,{mission});
    const p=problem("add",gap,b,{mission,variant:0});
    Object.assign(p,{story:`Un tramo del puente mide ${gap} unidades y otro mide ${b}. ¿Cuánto miden juntos?`,
      clue:"¿Qué pasa con la longitud cuando unes los dos tramos?"});

  if (mission==="dock") return Array.from({length:c.size},(_,i)=>{
    if (i<2) return problem("div",26,4,{mission,variant:i,theme:0});
    const b=random(3,9);
    return problem("div",b*random(3,12)+random(0,b-1),b,{mission,variant:i%4});
  });

function practiceControls() {
  const c=data.config;
  const randomMode=c.mode==="random";
  const mixed=c.op==="mix";
  const pair=randomMode || mixed?null:makePair(c.op,c);
  const unavailable=!randomMode && mixed?Object.keys(ops).filter(op=>!makePair(op,c)):[];
  const invalid=!randomMode && !mixed && !pair;
  const inProgress=data.round && !data.round.complete;
  return `<div class="stack">
    ${controls("mode",[["custom","Elegir yo"],["random","Todo aleatorio"]],"Modo de práctica")}
    ${randomMode?'<p class="muted">Cada reto sortea la operación y los dígitos de los dos números.</p>':`
      ${controls("op",[...Object.entries(ops).map(([id,op])=>[id,op.name]),["mix","Operaciones mezcladas"]],"Operación")}
      <div class="grid">${controls("da",lengths,c.op==="div"?"Dígitos del dividendo":"Dígitos del primer número")}
      ${controls("db",lengths,c.op==="div"?"Dígitos del divisor":"Dígitos del segundo número")}</div>`}
    <details id="practice-options"><summary>Ajustes de la ronda</summary><div class="grid section-gap">
    ${randomMode || mixed || c.op==="add"?controls("add",[["any","Cualquiera"],["yes","Con llevadas"],["no","Sin llevadas"]],"Suma"):""}
    ${randomMode || mixed || c.op==="sub"?controls("sub",[["any","Cualquiera"],["yes","Con préstamos"],["no","Sin préstamos"]],"Resta"):""}
    ${randomMode || mixed || c.op==="div"?controls("div",[["exact","Exacta"],["remainder","Con residuo"]],"División"):""}
    ${roundSize()}</div></details>
    ${pair?`<p class="note practice-note">Ejemplo · ${fmt(pair[0])} ${ops[c.op].symbol} ${fmt(pair[1])}</p>`:""}
    ${invalid?'<p class="note">Esta combinación no admite ejercicios. Aumenta los dígitos del primer número, reduce los del segundo o cambia el ajuste de la operación.</p>':""}
    ${unavailable.length?`<p class="note">Con estos ajustes, la ronda omite ${unavailable.map(op=>ops[op].name.toLowerCase()).join(" y ")}. Cambia los dígitos o el ajuste para incluirlas.</p>`:""}
    <div class="row">${btn(inProgress?"Preparar otra ronda":"Empezar a practicar",(inProgress?'data-go="paused"':'data-start=""')+(invalid?" disabled":""),"primary")}
    ${btn("Ejemplo de 23 × 14",'data-go="example"')}</div></div>`;
}
function practice() {
  return section("Practicar",practiceControls());

function rod(n,show=true) {
  return `<span class="rod" style="--n:${n};--color:${rodColors[n-1]};--rod-ink:${lightInk.has(n)?"#fff":"#172b24"}" ${show?`aria-label="Regleta de ${n}"`:'aria-hidden="true"'}>${show?n:""}</span>`;
}
const rodLine = pieces => `<div class="rod-row">${pieces.map(n=>rod(n)).join("")}</div>`;
const bar = (...pieces) => `<div class="bar">${pieces.map(text=>
  `<span class="${String(text).includes("?")?"unknown":""}">${text}</span>`).join("")}</div>`;
const placeParts = n => [...String(n)].map((d,i)=>Number(d)*10**(String(n).length-i-1)).filter(Boolean);
function area(p,solved=false) {
  const rows=placeParts(p.a), cols=placeParts(p.b);
  return `<figure><table class="area"><caption>${fmt(p.a)} × ${fmt(p.b)} por valor posicional</caption>
    <thead><tr><th scope="col">×</th>${cols.map(n=>`<th scope="col">${fmt(n)}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(a=>`<tr><th scope="row">${fmt(a)}</th>${cols.map(b=>
      `<td>${solved?fmt(a*b):`${fmt(a)} × ${fmt(b)}`}</td>`).join("")}</tr>`).join("")}</tbody></table>
    <p>${solved?`${rows.flatMap(a=>cols.map(b=>fmt(a*b))).join(" + ")} = <strong>${fmt(p.answer)}</strong>`:
      "Halla cuánto hay en cada parte y reúne los resultados."}</p></figure>`;
}
function visual(p,solved=false) {
  const {a,b,op,r,kind}=p;
  if (op==="mul") {
    if (a<=5 && b<=10) return `<p>${a} filas iguales</p>${Array.from({length:a},()=>rodLine([b])).join("")}<p>¿Cuánto miden todas juntas?</p>`;
    return area(p,solved);
  }
  if (op==="add" && Math.max(a,b)<=10) return `<p>Coloca las dos regletas punta con punta.</p>${rodLine([a,b])}${bar("Total ?")}`;
  if (op==="sub" && a<=10) return `<p>Alinea ambas desde la izquierda. Busca lo que falta en la segunda fila.</p>${rodLine([a])}${rodLine([b])}`;
  const x=fmt(a),y=fmt(b);
  if (op==="add") return `${bar("Total ?")}${bar(x,y)}<p>Las dos partes forman el total.</p>`;
  if (op==="sub") return `${bar(x+" en total")}${bar(y,"?")}<p>Busca la diferencia entre lo que tienes y el total.</p>`;
  if (a<=30 && b<=10 && kind!=="share") {
    const total=Array.from({length:Math.floor(a/10)},()=>10);
    if (a%10) total.push(a%10);
    return `<p>Total · ${x}</p>${rodLine(total)}<p>Usa regletas de ${y} para averiguar cuántas caben.</p>${rodLine([b])}`;
  }
  return `${bar(x+" en total")}${kind==="share"?bar("?","…","?"):bar(y,"…",y)}<p>${kind==="share"?
     `Hay ${y} grupos iguales. Busca el tamaño de cada uno.`:`Cada grupo contiene ${y}. Busca cuántos grupos completos caben.`}
     ${r?" Revisa qué debes hacer con lo que sobra.":""}</p>`;
}
function solution(p) {
  if (p.op==="mul") return area(p,true);
  const eq=`<strong>${fmt(p.a)} ${ops[p.op].symbol} ${fmt(p.b)} = ${fmt(p.answer)}${p.r?` y sobran ${fmt(p.r)}`:""}</strong>`;
  if (p.op==="div") return `<p>${p.kind==="share"?`Cada equipo recibe ${fmt(p.answer)}.`:`Caben ${fmt(p.answer)} grupos completos.`} Al multiplicar ${fmt(p.answer)} × ${fmt(p.b)} obtienes ${fmt(p.answer*p.b)}. Al comparar con ${fmt(p.a)}, sobran ${fmt(p.r)}.</p>
    <p>${eq}</p>${p.interpretation?`<p>Hace falta otro vehículo para quienes quedan. En total hacen falta <strong>${fmt(p.answer+1)}</strong>.</p>`:""}`;
  return `<p>${p.clue}</p>${visual(p,true)}<p>${eq}</p>`;
}
const labels = {read:"Comprensión del enunciado",firstOp:"Elección de operación",firstMath:"Cálculo",firstContext:"Interpretación del residuo"};
function statsTable(records) {
  return `<dl>${Object.entries(labels).map(([id,title])=>{
    const scored=records.filter(r=>typeof r[id]==="boolean");
    return `<dt><strong>${title}</strong></dt><dd>${scored.length?
      `${scored.filter(r=>r[id]).length} de ${scored.length} al primer intento`:"Aún sin respuestas registradas"}</dd>`;
  }).join("")}</dl>`;
}
function family() {
  return section("Para familia",`<p>El avance se guarda en este navegador. Cada fila cuenta solo los retos que evaluaron esa habilidad.</p>
    <p><strong>${data.history.length}</strong> retos registrados</p>${statsTable(data.history)}`);
}
function hintContent(p,s) {
  const readCheck=s.nudge || s.level===1 || s.read!==null;
  let content="";
  if (readCheck) {
    content+=`<p><strong>¿Qué debes averiguar?</strong></p><div class="row">${p.choices.map((choice,i)=>
      btn(choice,`data-read="${i}" ${s.readDone?"disabled":""}`)).join("")}</div>`;
    if (s.readDone) content+=`<p class="section-gap">Buscamos: ${p.goal.toLowerCase()}.</p>`;
    if (s.level>=1) content+=`<p class="section-gap">${p.clue}</p>`;
  }
  if (s.level>=2) content+=visual(p);
  if (s.level>=3) content+=`<div class="section-gap"><h3>Solución paso a paso</h3>${solution(p)}</div>`;
  return content;
}
function numericField(label,id,s,locked=false,optional=false) {
  const value=(s.draft[id] || "").replace(/[^0-9]/g,"");
  return `<label>${label}<input name="${id}" type="text" inputmode="numeric" pattern="[0-9]+" autocomplete="off" maxlength="8" value="${value}" ${locked?"readonly":optional?"":"required"}></label>`;
}
function buildContent(p,s) {
  const title={bridge:"Completa el puente",garden:"Prepara el huerto",dock:"Carga el muelle"}[data.round.mission];
  const target=p.interpretation?p.answer+1:p.answer;
  const prompt={bridge:p.op==="add"?"Coloca el tramo que reúne las dos longitudes.":"Coloca el tramo que falta.",
    garden:"Coloca la ficha con el total de plantas para completar el huerto.",
    dock:p.interpretation?"Elige la cantidad de vehículos que salen con el grupo.":p.kind==="share"?"Coloca la cantidad que recibe cada equipo.":"Elige cuántos grupos quedan preparados."}[data.round.mission];
  if (s.done) {
    const visualBuild=data.round.mission==="bridge"
      ? (p.op==="sub"?rodLine([p.b,...(target?[target]:[])]):rodLine([p.a,p.b]))
      : data.round.mission==="garden"?area(p,true)
      : bar(`${fmt(target)} ${p.interpretation?"vehículos":p.kind==="share"?"por equipo":"grupos completos"}`,...(p.r&&!p.interpretation?[`${fmt(p.r)} sobrantes`]:[]));

function paperNumber(w,id) {
  const digits=Object.keys(w.cells).filter(key=>key.startsWith(id+"-")).sort((a,b)=>Number(b.split("-")[1])-Number(a.split("-")[1]));
  if (!digits.length) return null;
  const first=Number(digits[0].split("-")[1]);
  let value="";
  for(let i=first;i>=0;i--) {
    const digit=w.cells[id+"-"+i];
    if (digit===undefined) return NaN;
    value+=digit;
  }
  return Number(value);
}
function paperHint(p,w,a,b) {
  const hint=(id,message)=>({id,message});
  if (p.op==="mul") {
    for (let i=0;i<String(b).length;i++) {
      const id="p"+i, partial=paperNumber(w,id);
      const digit=Math.floor(b/10**i)%10;
      if (partial!==null && partial!==a*digit) return hint(id,`Revisa el producto parcial de la fila ${i+1} y su posición.`);
    }
    return hint("result","Revisa los productos parciales y su suma.");
  }
  if (p.op==="div") {
    const digits=String(a);
    let prefix=1;
    while (prefix<digits.length && Number(digits.slice(0,prefix))<b) prefix++;
    let n=Number(digits.slice(0,prefix));
    for (let i=0;i<=digits.length-prefix;i++) {
      const product=n-n%b,rem=n%b;
      for (const [id,expected,label] of [["d"+i,n,"el número que divides"],["p"+i,product,"el producto"],["r"+i,rem,"la resta"],["down"+i,Number(digits[prefix+i]),"la cifra que bajas"]]) {
        const supplied=paperNumber(w,id);
        if (supplied!==null && supplied!==expected) return hint(id,`Revisa ${label} del paso ${i+1}.`);
      }
      n=rem*10+Number(digits[prefix+i]);
    }
    return paperNumber(w,"result")!==p.answer
      ?hint("result","Revisa el cociente. Comprueba cuánto cabe el divisor en cada paso.")
      :hint("remainder","Revisa el residuo. El divisor por el cociente más el residuo debe dar el dividendo.");
  }
  if (p.op==="add") {
    let carry=0;
    for (let i=0;i<Math.max(String(a).length,String(b).length);i++) {
      const n=Math.floor(a/10**i)%10+Math.floor(b/10**i)%10+carry;
      carry=Math.floor(n/10);
      const key="carry-"+(i+1);
      if (w.cells[key]!==undefined && Number(w.cells[key])!==carry) {
        return {cell:key,message:`Revisa la llevada a la ${["columna de decenas","columna de centenas","columna de millares","última columna"][i]}.`};
      }
    }
  }
  const borrowed=Object.keys(w.cells).filter(key=>key.startsWith("carry-"));
  if (p.op==="sub" && borrowed.length) {
    const bottom=String(b).padStart(String(a).length,"0").split("").reverse().map(Number);
    const top=String(a).split("").reverse().map(Number);
    const raw=[...top];
    const incoming=[...top];
    for(let i=0;i<top.length;i++) {
      if (top[i]<bottom[i]) {
        top[i]+=10;
        top[i+1]--;
        incoming[i+1]=top[i+1];
      }
    }
    for (const key of borrowed.sort((x,y)=>Number(x.split("-")[1])-Number(y.split("-")[1]))) {
      const i=Number(key.split("-")[1]);
      if (![top[i],raw[i],incoming[i]].includes(Number(w.cells[key]))) return {cell:key,message:`Revisa el préstamo en la columna de ${["unidades","decenas","centenas","millares"][i]}.`};
    }
  }
  return hint("result",p.op==="add"?"Revisa la suma desde las unidades y comprueba las llevadas.":"Revisa la resta desde las unidades y comprueba los préstamos.");
}
function paperCheck() {
  const p=current(),s=step(),w=paperState();
  const a=paperNumber(w,"a"),b=paperNumber(w,"b");
  const say=(message,selector="#paper-feedback")=>{
    w.message=message;
    refresh(selector);
    const field=app.querySelector(selector);
    if (field?.closest(".optional-work")) field.closest(".optional-work").open=true;
    field?.focus({preventScroll:true});
    field?.scrollIntoView({block:"center",inline:"nearest"});
  };
  const focusRow=id=>id==="a" || id==="b"?`[data-operand="${id}"]`:`[data-cell="${id}-0"]`;
  if (!w.op) return say("Revisa el planteamiento. Elige el símbolo de la operación.", "[data-paper-op]");
  if (s.level<2) s.firstOp ??= w.op===p.op;
  w.context=false;
  if (w.op!==p.op) {
    s.corrected=true;
    return say("Revisa el planteamiento. "+p.clue,`[data-paper-op="${w.op}"]`);
  }
  const commutative=p.op==="add" || p.op==="mul";
  if (!(a===p.a && b===p.b) && !(commutative && a===p.b && b===p.a)) {
    s.corrected=true;
    const first=a===p.a || commutative && a===p.b;
    return say("Revisa el planteamiento. ¿Qué representa cada número en la historia? "+p.clue,focusRow(first?"b":"a"));
  }
  const result=paperNumber(w,"result"),rem=paperNumber(w,"remainder");
  if (!Number.isFinite(result)) return say("El planteamiento está bien. Completa las casillas del resultado.",focusRow("result"));
  if (p.op==="div" && !Number.isFinite(rem) && (p.r || rem!==null)) return say("El planteamiento está bien. Escribe el residuo.",focusRow("remainder"));
  const right=result===p.answer && (p.op!=="div" || (rem ?? 0)===p.r);
  s.firstMath ??= right;
  if (!right) {
    s.corrected=true;
    const clue=paperHint(p,w,a,b);
    return say("El planteamiento está bien. "+clue.message,clue.cell?`[data-cell="${clue.cell}"]`:focusRow(clue.id));
  }

    if (context!==p.answer+1) {

  if (p.interpretation) s.draft.context=String(p.answer+1);
  delete w.message;
  page="round";
  complete();
}

function checkAnswer(event) {

  const p=current(),s=step();
  const mixed=needsOperation(data.round);
  if (mixed && !s.opOK) {
    if (!s.selected) {
      report("Elige una operación para comprobar tu respuesta.");
      refresh("[data-op]");
      return;
    }
    const right=s.selected===p.op;
    if (s.level<2) s.firstOp ??= right;
    if (!right) {
      s.nudge=true;
      s.corrected=true;
      report("Revisa la operación. Puedes empezar por identificar qué pide la historia.");
      refresh("#hint button");
      return;
    }
    s.opOK=true;
    if (p.r || !s.draft.answer) {
      report("Elegiste la operación correcta. Ahora completa el cálculo.",true);
      refresh("[name=answer]");
      return;
    }
  }
  if (!s.mathOK) {
    const right=Number(s.draft.answer)===p.answer && (!p.r || Number(s.draft.residue)===p.r);
    s.firstMath ??= right;
    if (!right) {
      s.corrected=true;
      report(p.r?"Revisa el cociente y el residuo. El divisor por el cociente más el residuo debe dar el dividendo."

      refresh("[name=answer]");

  }
  if (p.interpretation) {
    const right=Number(s.draft.context)===p.answer+1;
    s.firstContext ??= right;
    if (!right) {
      s.corrected=true;
      report("El cociente y el residuo están bien. ¿Qué vehículo usarán las personas que todavía no tienen asiento?");

function similar(p) {
  const c={...data.round.c,da:String(p.a).length,db:String(p.b).length};
  if (p.op==="div") c.div=p.r?"remainder":"exact";
  let pair=[p.a,p.b];
  for (let i=0;i<16 && pair[0]===p.a && pair[1]===p.b;i++) {
    pair=makePair(p.op,c) || [p.a,p.b];
  }
  if (pair[0]===p.a && pair[1]===p.b) return null;
  if (p.mission==="bridge") {
    const b=random(2,8);
    const gap=(p.answer%8)+2;
    pair=p.op==="sub"?[b+gap,b]:[gap,b];
  }
  const retry=problem(p.op,...pair,{variant:p.variant,theme:(p.theme+1)%themes.length,mission:p.mission});
  if (p.mission==="bridge" && p.op==="add") {
    retry.story=`Un tramo del puente mide ${pair[0]} unidades y otro mide ${pair[1]}. ¿Cuánto miden juntos?`;
    retry.clue="¿Qué pasa con la longitud cuando unes los dos tramos?";
  }
  return {...retry,retry:true};
}
function advance() {
  const r=data.round,p=current(),s=step();
  if (s.usedSolution && !p.retry) {
    const next=similar(p);
    if (next) r.queue.splice(r.mission==="detect" && r.index===0 ? 2 : r.index+1,0,next);
  }
  if (r.index+1===r.queue.length) {
    r.complete=true;
    go("summary");
    return;
  }
  r.index++;
  r.step=fresh();
  go("round");
}
function readCheck(index) {
  const s=step(),p=current();
  const right=p.choices[index]===p.goal;
  if (s.level<2) s.read ??= right;
  if (right) {
    s.readDone=true;
    if (!s.done) report("Identificaste lo que pide la historia.",true);
  } else {
    s.corrected=true;
    report("Vuelve a leer la pregunta del enunciado. Busca la cantidad que aún hace falta saber.");
  }
  refresh(right?"[data-hint]":"#hint button");
}
function addRod(row,n) {
  if (!Number.isInteger(n) || n<1 || n>10 || data.board[row].length>=50) return;
  boardUndo.push(data.board.map(pieces=>[...pieces]));
  data.board[row].push(n);
  refresh(`[data-place="${row}"]`);
}
app.addEventListener("submit",checkAnswer);
app.addEventListener("input",event=>{
  const input=event.target;
  if (input.dataset.operand) {
    const id=input.dataset.operand;
    const width=input.maxLength;
    const cells=paperState().cells;
    const cursor=input.value.slice(0,input.selectionStart).replace(/[^0-9]/g,"").length;
    const digits=input.value.replace(/[^0-9]/g,"").slice(0,width);
    if (digits!==input.value) {
      input.value=digits;
      input.setSelectionRange(cursor,cursor);
    }
    for (let i=0;i<4;i++) {
      const digit=digits[digits.length-i-1],key=id+"-"+i;
      if (digit===undefined) delete cells[key];
      else cells[key]=digit;
    }
    paintOperand(input);
    if (id==="b") updateMultiplicationRows(digits.length);
    if (id==="a" && paperState().op==="mul") {
      delete paperState().carryEdit;
      refreshCarryTrack();
    }
    save();
    return;
  }
  if (input.dataset.cell) {
    input.value=input.value.replace(/[^0-9]/g,"");
    const w=paperState();
    if (input.value) w.cells[input.dataset.cell]=input.value;
    else delete w.cells[input.dataset.cell];
    if (w.op==="mul" && /^(?:p\d+|result)-/.test(input.dataset.cell)) {
      delete w.carryEdit;
      refreshCarryTrack();
    }
    save();
  }
  if (input.closest("#answer")) {
    input.value=input.value.replace(/[^0-9]/g,"");
    step().draft[input.name]=input.value;
    save();
  }
});
app.addEventListener("change",event=>{
  const input=event.target;
  const id=input.dataset.setting;
  if (id) {
    data.config[id]=["da","db","size"].includes(id)?Number(input.value):input.value;
    const open=input.closest("details")?.open;
    refresh(`[data-setting="${id}"]`);
    if (open) {
      const details=app.querySelector("#practice-options");
      if (details) details.open=true;
      app.querySelector(`[data-setting="${id}"]`)?.focus({preventScroll:true});
    }
  }
});
app.addEventListener("dragstart",event=>{
  const button=event.target.closest("[data-rod]");
  if (button) {
    event.dataTransfer.effectAllowed="copy";
    event.dataTransfer.setData("text/plain",button.dataset.rod);
  }
});
app.addEventListener("dragover",event=>{
  if (event.target.closest("[data-drop]")) event.preventDefault();
});
app.addEventListener("drop",event=>{
  const row=event.target.closest("[data-drop]");
  if (row) {
    event.preventDefault();
    addRod(Number(row.dataset.drop),Number(event.dataTransfer.getData("text/plain")));
  }
});
for (const type of ["focusin","focusout","select","keyup"]) {
  app.addEventListener(type,event=>{
    if (event.target.dataset.operand) paintOperand(event.target);
  });
}
app.addEventListener("click",event=>{
  const input=event.target;
  if (!input.dataset.operand || !event.detail) return;
  const slots=[...input.parentElement.querySelectorAll(".paper-operand-slot")];
  const slot=slots.findIndex(cell=>{
    const rect=cell.getBoundingClientRect();
    return event.clientX>=rect.left && event.clientX<=rect.right;
  });
  const index=slot-slots.length+input.value.length;
  const start=index<0?input.value.length:index;
  input.setSelectionRange(start,Math.min(start+1,input.value.length));
  paintOperand(input);
});
app.addEventListener("focusin",event=>{
  const row=event.target.closest("[data-partial-row]");
  if (row) showMultiplicationCarry(Number(row.dataset.partialRow));
  if (event.target.dataset.cell?.startsWith("result-")) {
    const carries=app.querySelector("#mul-carries");
    if (carries && (operandText(paperState().cells,"b",Number(carries.dataset.width)).length || Number(carries.dataset.rows))>1) {
      showMultiplicationCarry("sum");
    }
  }
});
app.addEventListener("keydown",event=>{
  if (!event.target.dataset.cell || !["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"].includes(event.key)) return;
  const row=event.target.closest(".paper-row");
  const column=Number(event.target.dataset.column);
  const rows=[...app.querySelectorAll(".paper-row")];
  let target;
  if (event.key==="ArrowUp" || event.key==="ArrowDown") {
    const next=rows[rows.indexOf(row)+(event.key==="ArrowUp"?-1:1)];
    target=next?.querySelector(`[data-column="${column}"]`) || next?.querySelector("[data-cell]");
  } else {
    target=row.querySelector(`[data-column="${column+(event.key==="ArrowLeft"?1:-1)}"]`);
  }
  if (target) { event.preventDefault(); target.focus(); target.select(); }
});
document.addEventListener("click",event=>{
  const button=event.target.closest("button");
  if (!button) return;
  const a=button.dataset;
  if (a.go) { changeScreen(a.go); return; }
  if (a.start!==undefined) { start(a.start); return; }
  if (a.resume!==undefined) {
    go(data.round?.resumePage==="paper"?"paper":"round");
    return;
  }
  if (a.replace) { data.round=null; go(a.replace); return; }
  if (a.rod) { selectedRod=Number(a.rod); refresh(`[data-rod="${a.rod}"]`); return; }
  if (a.place!==undefined) { addRod(Number(a.place),selectedRod); return; }
  if (a.undo!==undefined && boardUndo.length) { data.board=boardUndo.pop(); refresh(boardUndo.length?"[data-undo]":"[data-place]"); return; }
  if (a.clear!==undefined) {
    boardUndo.push(data.board.map(row=>[...row]));
    data.board=[[],[],[]];
    refresh("[data-undo]");
    return;
  }
  if (a.labels!==undefined) { data.labels=!data.labels; refresh("[data-labels]"); return; }
  if (a.editCarry) {
    paperState().carryEdit=Number(a.editCarry);
    refreshCarryTrack();
    app.querySelector("[data-current-carry]")?.focus();
    app.querySelector("[data-current-carry]")?.select();
    return;
  }
  if (a.paperOpen!==undefined) {
    step().paper={op:"",cells:{}};
    go("paper");
    return;
  }
  if (a.paperClose!==undefined) { go("round"); return; }
  if (a.paperOp) {
    const w=paperState();
    w.op=a.paperOp;
    w.context=false;
    delete w.message;
    step().selected=a.paperOp;
    if (step().opOK && a.paperOp!==current().op) {
      step().opOK=false;
      step().mathOK=false;
    }
    refresh(`[data-paper-op="${a.paperOp}"]`);
    return;
  }
  if (a.paperCheck!==undefined) { paperCheck(); return; }
  if (page!=="round") return;
  const p=current(),s=step();
  if (a.speak!==undefined && synth && voices.length) {
    cancelSpeech();
    const utterance=new SpeechSynthesisUtterance(p.story);
    utterance.voice=voices[0];
    utterance.lang=voices[0].lang;
    utterance.rate=.92;
    utterance.onend=()=>{ if (speaking===utterance) speaking=null; };
    speaking=utterance;
    synth.speak(utterance);
  }
  if (a.op) { s.selected=a.op; refresh(`[data-op="${a.op}"]`); }
  if (a.readHelp!==undefined) { s.nudge=true; refresh("#hint button"); }
  if (a.read!==undefined) readCheck(Number(a.read));
  if (a.hint!==undefined) {
    s.level++;
    if (s.level===3) {
      s.usedSolution=true;
      s.done=true;
      record(p,s);
      report(p.retry?"Revisa cómo se resuelve el reto.":"Revisa la solución y prueba con otros números.");
    }
    refresh("#hint");
  }
  if (a.build!==undefined) {
    const right=Number(a.build)===(p.interpretation?p.answer+1:p.answer);
    s.done=right;
    report(right?"¡Misión completada!":"Usa la cantidad que acabas de calcular.",right);
    refresh(right?"[data-next]":`[data-build="${a.build}"]`);
  }
  if (a.next!==undefined) advance();
});
render();
</script>

  navigator.serviceWorker.register("./sw.js").catch(error => {
    console.warn("Operaciones básicas con Vale: no se pudo preparar el acceso sin conexión.", error);
  });
}
